<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Expense Tracker</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 500px; background: #fff; padding: 20px; margin: auto; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #4a90e2; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #4a90e2; color: white; border: none; padding: 10px; width: 100%; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:hover { background: #357abd; }
        .total { font-size: 18px; font-weight: bold; margin-top: 20px; text-align: right; }
        ul { list-style: none; padding: 0; margin-top: 20px; }
        li { background: #fafafa; padding: 10px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .delete-btn { background: #ff5c5c; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .delete-btn:hover { background: #e04141; }
    </style>
</head>
<body>

<div class="container">
    <h2>Expense Tracker</h2>
    
    <div class="form-group">
        <label for="filterMonth">View Month:</label>
        <select id="filterMonth" onchange="renderExpenses()">
            <option value="All">All Months</option>
            <option value="01">January</option>
            <option value="02">February</option>
            <option value="03">March</option>
            <option value="04">April</option>
            <option value="05">May</option>
            <option value="06">June</option>
            <option value="07">July</option>
            <option value="08">August</option>
            <option value="09">September</option>
            <option value="10">October</option>
            <option value="11">November</option>
            <option value="12">December</option>
        </select>
    </div>

    <div class="form-group">
        <label for="expenseDesc">Description:</label>
        <input type="text" id="expenseDesc" placeholder="e.g., Lunch, Bus fare">
    </div>

    <div class="form-group">
        <label for="expenseAmount">Amount (₹):</label>
        <input type="number" id="expenseAmount" placeholder="e.g., 150">
    </div>

    <div class="form-group">
        <label for="expenseDate">Date:</label>
        <input type="date" id="expenseDate">
    </div>

    <button onclick="addExpense()">Add Expense</button>

    <div class="total">
        Total: ₹<span id="totalAmount">0</span>
    </div>

    <ul id="expenseList"></ul>
</div>

<script>
    // Set today's date automatically on load
    document.getElementById('expenseDate').valueAsDate = new Date();

    let expenses = JSON.parse(localStorage.getItem('expenses')) || [];

    function addExpense() {
        const desc = document.getElementById('expenseDesc').value;
        const amount = document.getElementById('expenseAmount').value;
        const date = document.getElementById('expenseDate').value;

        if (!desc || !amount || !date) {
            alert('Please fill in all fields!');
            return;
        }

        const expense = {
            id: Date.now(),
            desc,
            amount: parseFloat(amount),
            date
        };

        expenses.push(expense);
        localStorage.setItem('expenses', JSON.stringify(expenses));

        // Clear fields
        document.getElementById('expenseDesc').value = '';
        document.getElementById('expenseAmount').value = '';
        document.getElementById('expenseDate').valueAsDate = new Date();

        renderExpenses();
    }

    function deleteExpense(id) {
        expenses = expenses.filter(exp => exp.id !== id);
        localStorage.setItem('expenses', JSON.stringify(expenses));
        renderExpenses();
    }

    function renderExpenses() {
        const list = document.getElementById('expenseList');
        const totalSpan = document.getElementById('totalAmount');
        const selectedMonth = document.getElementById('filterMonth').value;
        
        list.innerHTML = '';
        let total = 0;

        const filteredExpenses = expenses.filter(exp => {
            if (selectedMonth === 'All') return true;
            const expMonth = exp.date.split('-')[1]; // Extracts MM from YYYY-MM-DD
            return expMonth === selectedMonth;
        });

        filteredExpenses.forEach(exp => {
            total += exp.amount;
            const li = document.createElement('li');
            li.innerHTML = `
                <span><strong>${exp.date}</strong> - ${exp.desc}: ₹${exp.amount.toFixed(2)}</span>
                <button class="delete-btn" onclick="deleteExpense(${exp.id})">X</button>
            `;
            list.appendChild(li);
        });

        totalSpan.textContent = total.toFixed(2);
    }

    renderExpenses();
</script>

</body>
</html>
